# ============================================================================
# GitHub Actions — Playwright Test Pipeline
# ============================================================================
#
# Runs Playwright tests on push/PR to main. Supports:
#   - Sharding across multiple jobs for faster execution
#   - Artifact upload (HTML reports, traces)
#   - Merge of sharded reports into a single HTML report
#
# Trigger: push to main, or PR targeting main
#
# ============================================================================

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: healthhub-app/tests/package-lock.json

      - name: Install dependencies
        working-directory: healthhub-app/tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: healthhub-app/tests
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        working-directory: healthhub-app/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: healthhub-app/frontend
        run: npm ci

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        working-directory: healthhub-app/tests
        run: npx playwright test --config=framework/config/playwright.config.js --project=chromium --shard=${{ matrix.shard }}
        env:
          CI: true
          TEST_ENV: local

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: healthhub-app/tests/blob-report/
          retention-days: 7

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: healthhub-app/tests
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        working-directory: healthhub-app/tests
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: healthhub-app/tests/playwright-report/
          retention-days: 14
